name: 手动采集

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 连续触发几轮；每轮最多采集 BATCH_SIZE 个最久未采集的组
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "6"

permissions:
  contents: read

jobs:
  collect:
    name: 触发 Cloudflare 采集
    runs-on: ubuntu-latest
    steps:
      - name: 检查手动触发配置
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::缺少 Repository Variable：WORKER_URL"
            exit 1
          fi
          if [ -z "$MANUAL_TRIGGER_TOKEN" ]; then
            echo "::error::缺少 Repository Secret：MANUAL_TRIGGER_TOKEN"
            exit 1
          fi
      - name: 连续触发若干轮采集
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          base_url="${WORKER_URL%/}"
          round=1
          while [ "$round" -le "$ROUNDS" ]; do
            echo "第 $round 轮"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $MANUAL_TRIGGER_TOKEN" \
              "$base_url/admin/run"
            echo
            round=$((round + 1))
          done
