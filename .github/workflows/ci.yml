name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 测试与 Worker 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 运行测试
        run: npm test
      - name: 验证 Cloudflare Worker 可构建
        run: npm run worker:build

  deploy:
    name: 部署到 Cloudflare Worker
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 检查部署 Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "缺少 GitHub Actions Repository Secrets:$missing"
            exit 1
          fi
      - name: 生成临时 Worker secret 文件
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
        run: |
          node -e "const fs=require('node:fs'); const value={DATABASE_URL:process.env.DATABASE_URL}; if(process.env.MANUAL_TRIGGER_TOKEN)value.MANUAL_TRIGGER_TOKEN=process.env.MANUAL_TRIGGER_TOKEN; fs.writeFileSync('.worker-secrets.json',JSON.stringify(value))"
      - name: 原子部署 Worker 与数据库连接 secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .worker-secrets.json
      - name: 清理临时 secret 文件
        if: always()
        run: rm -f .worker-secrets.json
